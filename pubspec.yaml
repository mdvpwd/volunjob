name: volunjob
description: "VolunJob — temukan proyek relawan & karier berdampak sosial."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Folder aset. PENTING: Flutter hanya memuat file yang berada LANGSUNG di
  # folder yang terdaftar (tidak rekursif), jadi tiap sub-folder ditulis
  # sendiri. Menambah gambar baru ke salah satu folder ini tidak perlu ubah
  # pubspec lagi — cukup taruh filenya lalu jalankan `flutter pub get`.
  # Kalau bikin sub-folder baru (mis. assets/images/banner/), tambahkan di sini.
  assets:
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/icons/
